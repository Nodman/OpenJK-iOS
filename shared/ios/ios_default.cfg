// OpenJK iOS defaults. Runs after (mp)default.cfg and before your own config.
seta r_primitives 2
seta r_flares 0
seta r_DynamicGlow 0
seta r_ignorehwgamma 1
seta r_ext_compress_textures 0
seta r_ext_multisample 0
seta r_subdivisions 8
seta r_ext_texture_filter_anisotropic 2
seta cg_shadows 1
// refraction copies the screen mid-frame; costly on tile GPUs
seta cg_renderToTextureFX 0
// Native resolution; Auto remains available in Video.
seta r_renderScale 1
seta com_maxfps 60
seta s_mixahead 0.1
seta in_joystick 1
seta j_twinStick 1
seta in_touchControls 1
seta in_touchAimMode 1
seta in_touchLookScale 1.0
seta in_touchLookScaleY 0.6
seta in_touchDragScale 3.0
seta in_touchDragScaleY 1.8
seta in_touchOpacity 1.0
seta in_touchHaptics 1
// gamepad (ios_gamepad.cpp sends JOY0+SDL button, JOY21 = LT, JOY22 = RT)
bind JOY0 +moveup
bind JOY1 +movedown
bind JOY2 +use
bind JOY3 +useforce
bind JOY4 +scores
bind JOY7 +speed
bind JOY9 weapprev
bind JOY10 weapnext
bind JOY11 forcenext
bind JOY12 forceprev
bind JOY13 saberAttackCycle
bind JOY21 +altattack
bind JOY22 +attack
