name: iOS

on:
  push:
    branches: [ios]
    tags: ['ios-v*']
  pull_request:
    branches: [ios]
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Boost
        run: brew install boost

      - name: Configure unit tests
        run: cmake -S . -B build-tests -DBuildTests=ON -DBuildMPEngine=OFF -DBuildMPRdVanilla=OFF -DBuildMPDed=OFF -DBuildMPGame=OFF -DBuildMPCGame=OFF -DBuildMPUI=OFF -DBuildMPRend2=OFF -DBuildSPEngine=OFF -DBuildSPGame=OFF -DBuildSPRdVanilla=OFF

      - name: Build and run unit tests
        run: cmake --build build-tests --target UnitTests && ./build-tests/UnitTests

  host-tests:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SDL2 and libpng
        run: brew install sdl2 libpng

      - name: Configure desktop build for host tests
        run: cmake -S . -B build-desktop -DCMAKE_BUILD_TYPE=Release

      - name: Run host tests
        run: |
          for test in tests/ios/*_host.py; do
            case "$test" in *angle_consumer_host.py) continue;; esac
            echo "== $test"
            python3 "$test"
          done

  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "OPENJK_IOS_VERSION=${GITHUB_REF_NAME#ios-v}" >> "$GITHUB_ENV"
          else
            echo "OPENJK_IOS_VERSION=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build IPAs
        run: scripts/build-ios.sh

      - name: Check module symbols
        run: scripts/ios/check-modules.sh build-ios all

      - uses: actions/upload-artifact@v4
        with:
          name: ipas
          path: build-ios/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: [unit-tests, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ipas
          path: build-ios/dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build-ios/dist/*.ipa build-ios/dist/SHA256SUMS --title "OpenJK iOS ${GITHUB_REF_NAME#ios-v}" --notes-file docs/ios-release-notes.md

  altstore-source:
    if: startsWith(github.ref, 'refs/tags/ios-v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ios
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ipas
          path: build-ios/dist

      # Build number comes from the tagged commit, which the branch head may be past.
      - name: Create AltStore source
        run: python3 scripts/ios/make-altstore-source.py --dist build-ios/dist --version "${GITHUB_REF_NAME#ios-v}" --build-version "$(git rev-list --count "$GITHUB_REF_NAME")" --repo "$GITHUB_REPOSITORY" --out altstore/source.json

      - name: Commit source to ios
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add altstore/source.json
          git diff --cached --quiet && exit 0
          git commit -m "[iOS] Update AltStore source for $GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git pull --rebase origin ios && git push origin ios && exit 0
            sleep 10
          done
          exit 1
