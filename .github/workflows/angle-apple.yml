name: Pinned ANGLE iOS frameworks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the newly built immutable dependency release
        type: boolean
        default: false
      compare_libcxx:
        description: Build isolated custom-libc++ size comparison
        type: boolean
        default: true

permissions: {}
concurrency:
  group: angle-apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DEPOT_TOOLS_UPDATE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The runner must already carry the exact qualified Xcode/SDK and arm64 host.
      - name: Exact toolchain preflight and recipe cache identity
        id: recipe
        shell: bash
        run: |
          bash scripts/ios/build-angle-apple.sh preflight
          key=$(bash scripts/ios/build-angle-apple.sh cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: build-angle-apple
          key: angle-inputs-${{ steps.recipe.outputs.key }}
      - name: Acquire pinned dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/ios/build-angle-apple.sh sync --root "$GITHUB_WORKSPACE/build-angle-apple"
      - name: Validate restored or acquired inputs
        run: bash scripts/ios/build-angle-apple.sh verify-source --root "$GITHUB_WORKSPACE/build-angle-apple"
      # Cache only pristine dependencies, before patching or generating outputs.
      - uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: build-angle-apple
          key: angle-inputs-${{ steps.recipe.outputs.key }}
      - name: Build and audit exact production args
        run: bash scripts/ios/build-angle-apple.sh build --root "$GITHUB_WORKSPACE/build-angle-apple"
      - name: Isolated libc++ comparison
        if: inputs.compare_libcxx
        run: bash scripts/ios/build-angle-apple.sh build --root "$GITHUB_WORKSPACE/build-angle-apple" --variant libcxx-on
      - uses: actions/upload-artifact@v4
        with:
          name: angle-qualified
          path: build-angle-apple/package-qualified/
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: inputs.compare_libcxx
        with:
          name: angle-libcxx-comparison
          path: build-angle-apple/package-libcxx-on/
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: inputs.publish
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: angle-qualified
          path: angle-qualified
      - name: Verify and create a new release without replacement
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TARGET: ${{ github.sha }}
        run: bash scripts/ios/build-angle-apple.sh publish --package "$GITHUB_WORKSPACE/angle-qualified" --repo "$RELEASE_REPOSITORY" --target "$RELEASE_TARGET"
